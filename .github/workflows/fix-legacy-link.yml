name: Point the old android-latest link at a verified release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Verified release whose APK the old link should serve"
        default: "v1.1"
        required: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the release APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl
          gh release download "$TAG" -p Zoomify.apk -p Zoomify.apk.sha256
          sha256sum -c Zoomify.apk.sha256
      - name: Swap the file served at the old URL
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1) bash .github/scripts/refresh-legacy-link.sh dl/Zoomify.apk "${{ inputs.tag }}"
