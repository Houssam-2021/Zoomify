name: Create private key-rotation test fixtures (one-time)

# One-time job, run once before the compromised legacy key is removed from the repository.
# It is the LAST use of that key. It produces, in a DRAFT release (visible only to people with write access):
#   - zoomify-1.0-legacy.apk: a copy of the original public v1.0 (signed with the legacy key), to test 1.0 -> new updates
#   - TEST-ONLY-legacy-attacker.apk: the app signed ONLY with the legacy key, versionCode 999999, to prove that updated
#     phones reject it (with that versionCode, a rejection can only be caused by the signature)
# It also extracts the signing lineage (key-rotation proof) from the published v1.1 APK so future releases can be
# signed with the new key alone. The lineage is public data (it is inside every v1.1 APK), not a secret.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_CERT_SHA256: 1a9f720214ac233d6f5be7e1ae5994911fbdab50d52ae43659521c0dab8dc12c
  NEW_CERT_SHA256: 7296cdbf1dd613c75317e45a288fab9bc043d82de5339d44fbec70bf91a7cccf
  V11_SHA256: ebca94a408dad408bb4556f8ccf6addb83c7247e3a4ad685086798907194597a
  FIXTURE_RELEASE: PRIVATE test fixtures (draft, never publish)

jobs:
  fixtures:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Refuse to run twice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[]|select(.name==\"$FIXTURE_RELEASE\")]|length")
          [ "$n" = 0 ] || { echo "::error::Fixture draft already exists"; exit 1; }

      - name: Build the attacker fixture (legacy key only, versionCode 999999)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); echo "BT=$BT" >> "$GITHUB_ENV"
          ./gradlew --no-daemon assembleRelease -PzoomifyTestVersionCode=999999
          mkdir -p fixtures
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks app/zoomify-sideload.keystore --ks-pass pass:REDACTED --ks-key-alias zoomify \
            --key-pass pass:REDACTED --out fixtures/TEST-ONLY-legacy-attacker.apk "$RUNNER_TEMP/aligned.apk"
          C=$("$BT/apksigner" verify --print-certs fixtures/TEST-ONLY-legacy-attacker.apk)
          grep -q "SHA-256 digest: $LEGACY_CERT_SHA256" <<<"$C"
          [ "$(grep -c 'certificate SHA-256 digest' <<<"$C")" -eq 1 ]
          B=$("$BT/aapt2" dump badging fixtures/TEST-ONLY-legacy-attacker.apk); grep -q "versionCode='999999'" <<<"$B"

      - name: Copy the original v1.0 and verify it
        run: |
          set -euo pipefail
          curl -sSfL -o fixtures/zoomify-1.0-legacy.apk \
            https://github.com/Houssam-2021/Zoomify/releases/download/android-latest/Zoomify-1.0-old-key-superseded.apk
          C=$("$BT/apksigner" verify --print-certs fixtures/zoomify-1.0-legacy.apk)
          grep -q "SHA-256 digest: $LEGACY_CERT_SHA256" <<<"$C"
          [ "$(grep -c 'certificate SHA-256 digest' <<<"$C")" -eq 1 ]
          B=$("$BT/aapt2" dump badging fixtures/zoomify-1.0-legacy.apk); grep -q "versionCode='1'" <<<"$B"

      - name: Extract the signing lineage from the published v1.1
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/v1.1.apk" https://github.com/Houssam-2021/Zoomify/releases/download/v1.1/Zoomify.apk
          echo "$V11_SHA256  $RUNNER_TEMP/v1.1.apk" | sha256sum -c
          # Write v1.1's lineage unchanged, using apksigner's own library (apksig).
          cat > "$RUNNER_TEMP/ExtractLineage.java" <<'JAVA'
          import com.android.apksig.SigningCertificateLineage;
          import java.io.File;
          public class ExtractLineage {
            public static void main(String[] a) throws Exception {
              SigningCertificateLineage.readFromApkFile(new File(a[0])).writeToFile(new File(a[1]));
            }
          }
          JAVA
          java -cp "$BT/lib/apksigner.jar" "$RUNNER_TEMP/ExtractLineage.java" "$RUNNER_TEMP/v1.1.apk" fixtures/zoomify-v1.1.lineage
          "$BT/apksigner" lineage --in fixtures/zoomify-v1.1.lineage --print-certs -v
          echo "LINEAGE_BASE64_BEGIN"; base64 -w0 fixtures/zoomify-v1.1.lineage; echo; echo "LINEAGE_BASE64_END"

      - name: Store fixtures in a private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum fixtures/* | tee fixtures/SHA256SUMS
          gh release create test-fixtures-private --draft --title "$FIXTURE_RELEASE" \
            --notes "Private test fixtures for the key-rotation tests. Contains APKs signed with the COMPROMISED legacy key. Never publish this draft." \
            fixtures/zoomify-1.0-legacy.apk fixtures/TEST-ONLY-legacy-attacker.apk fixtures/SHA256SUMS
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[]|select(.name==\"$FIXTURE_RELEASE\")|\"draft=\(.draft) id=\(.id) assets=\([.assets[].name])\""
