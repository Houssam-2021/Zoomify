name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Zoomify.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoomify-apk
          path: android/Zoomify.apk

      - name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Zoomify.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Zoomify for Android (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on branch ${GITHUB_REF_NAME}. Download Zoomify.apk on your phone and open it to install."
