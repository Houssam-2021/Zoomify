name: Android APK

# Every push: build, sign (new key + v3 rotation proof), verify, audit, and test the key rotation on Android 11/12/13
# emulators. Nothing public changes.
# Publishing: Actions -> Android APK -> Run workflow, tick "publish". Only runs after every check above passes.

on:
  push:
    paths:
      - "android/**"
      - "site/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish: create the versioned GitHub release and deploy the website to Cloudflare Pages"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  NEW_CERT_SHA256: 7296cdbf1dd613c75317e45a288fab9bc043d82de5339d44fbec70bf91a7cccf
  LEGACY_CERT_SHA256: 1a9f720214ac233d6f5be7e1ae5994911fbdab50d52ae43659521c0dab8dc12c

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
    env:
      HAS_SIGNING_KEY: ${{ secrets.ZOOMIFY_KEYSTORE_B64 != '' && secrets.ZOOMIFY_KEYSTORE_PASSWORD != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: meta
        run: |
          echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build unsigned release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # Public releases are never signed with the leaked legacy key alone. Without the new key, stop here.
      - name: Require the new signing key
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::error::Add the ZOOMIFY_KEYSTORE_B64 and ZOOMIFY_KEYSTORE_PASSWORD repository secrets. Nothing was published."
          exit 1

      # Key rotation (APK Signature Scheme v3): the APK carries a proof, signed by the old (leaked) key, that the
      # new key replaces it. The old key keeps "installed data" (so existing installs can update) but loses
      # "rollback", so once a phone has this version, an APK signed only with the leaked key can't replace it.
      - name: Sign with the new key and rotation proof
        env:
          ZOOMIFY_KEYSTORE_B64: ${{ secrets.ZOOMIFY_KEYSTORE_B64 }}
          ZOOMIFY_KEYSTORE_PASSWORD: ${{ secrets.ZOOMIFY_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          umask 077
          KEYDIR="$RUNNER_TEMP/keys"
          mkdir -p "$KEYDIR"
          echo "$ZOOMIFY_KEYSTORE_B64" | base64 -d > "$KEYDIR/new.p12"
          LEGACY=app/zoomify-sideload.keystore

          "$BT/apksigner" rotate --out "$KEYDIR/lineage.bin" \
            --old-signer --ks "$LEGACY" --ks-pass pass:REDACTED --ks-key-alias zoomify --key-pass pass:REDACTED \
              --set-rollback false --set-permission false --set-shared-uid false --set-auth false \
            --new-signer --ks "$KEYDIR/new.p12" --ks-type PKCS12 --ks-pass env:ZOOMIFY_KEYSTORE_PASSWORD \
              --ks-key-alias zoomify

          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$KEYDIR/aligned.apk"

          "$BT/apksigner" sign \
            --ks "$LEGACY" --ks-pass pass:REDACTED --ks-key-alias zoomify --key-pass pass:REDACTED \
            --next-signer --ks "$KEYDIR/new.p12" --ks-type PKCS12 --ks-pass env:ZOOMIFY_KEYSTORE_PASSWORD \
              --ks-key-alias zoomify \
            --lineage "$KEYDIR/lineage.bin" --rotation-min-sdk-version 28 \
            --out Zoomify.apk "$KEYDIR/aligned.apk"

          # Test-only APK signed with the leaked key alone: used to prove phones reject it. Never published.
          mkdir -p test-apks
          "$BT/apksigner" sign --ks "$LEGACY" --ks-pass pass:REDACTED --ks-key-alias zoomify --key-pass pass:REDACTED \
            --out test-apks/TEST-ONLY-legacy-signed.apk "$KEYDIR/aligned.apk"
          rm -rf "$KEYDIR"

      # Mandatory: any failure here stops the build, so nothing unverified can be published.
      - name: Verify signature, rotation proof and version
        run: |
          set -euo pipefail
          mkdir -p signing-report
          "$BT/apksigner" verify -v --print-certs Zoomify.apk | tee signing-report/verify.txt
          "$BT/apksigner" lineage --in Zoomify.apk --print-certs | tee signing-report/lineage.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" signing-report/verify.txt
          grep -q "Number of signers: 1" signing-report/verify.txt
          grep -q "certificate SHA-256 digest: $NEW_CERT_SHA256" signing-report/verify.txt \
            || { echo "::error::Not signed with the new release key"; exit 1; }
          # Lineage must be exactly: legacy (rollback revoked) -> new key.
          python3 - <<'PY'
          import os, re
          signers, current = {}, None
          for line in open("signing-report/lineage.txt"):
              m = re.match(r"Signer #(\d+) in lineage certificate SHA-256 digest: ([0-9a-f]+)", line)
              if m:
                  current = int(m.group(1)); signers[current] = {"digest": m.group(2)}
                  continue
              m = re.match(r"Has (.+?) capability\s*: (\w+)", line)
              if m and current is not None:
                  signers[current][m.group(1)] = m.group(2)
          assert sorted(signers) == [1, 2], f"expected exactly 2 signers in lineage, got {sorted(signers)}"
          old, new = signers[1], signers[2]
          assert old["digest"] == os.environ["LEGACY_CERT_SHA256"], "lineage does not start at the legacy key"
          assert new["digest"] == os.environ["NEW_CERT_SHA256"], "lineage does not end at the new key"
          assert old["installed data"] == "true", "legacy key must keep installed-data (in-place updates)"
          assert old["rollback"] == "false", "legacy key must not have rollback"
          print("Lineage OK: legacy -> new, legacy rollback revoked:", signers)
          PY
          "$BT/aapt2" dump badging Zoomify.apk | tee signing-report/badging.txt
          grep -q "versionCode='${{ steps.meta.outputs.version_code }}'" signing-report/badging.txt
          grep -q "versionName='${{ steps.meta.outputs.version }}'" signing-report/badging.txt
          grep -q "debuggable" signing-report/badging.txt && { echo "::error::APK is debuggable"; exit 1; } || true
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml Zoomify.apk > signing-report/AndroidManifest.txt
          # Permission allow-list: no INTERNET (photos can't leave the phone) and no app-defined permissions
          # (they break key-rotation updates on Android 11/12).
          PERMS=$(grep -oP "^uses-permission: name='\K[^']+" signing-report/badging.txt | sort -u | tr '\n' ' ')
          echo "Permissions: $PERMS"
          [ "$PERMS" = "android.permission.CAMERA android.permission.RECORD_AUDIO android.permission.VIBRATE " ] \
            || { echo "::error::Unexpected permissions: $PERMS"; exit 1; }
          grep -q "E: permission " signing-report/AndroidManifest.txt && { echo "::error::APK defines a custom permission"; exit 1; } || true
          sha256sum Zoomify.apk | tee signing-report/Zoomify.apk.sha256

      - name: Get v1.0 (legacy-signed) for the rotation test
        run: |
          set -euo pipefail
          curl -sSfL -o test-apks/zoomify-1.0-legacy.apk \
            https://github.com/Houssam-2021/Zoomify/releases/download/android-latest/Zoomify.apk
          "$BT/apksigner" verify --print-certs test-apks/zoomify-1.0-legacy.apk | grep "SHA-256 digest: $LEGACY_CERT_SHA256"
          cp Zoomify.apk test-apks/Zoomify.apk

      - name: Upload signed APK and report
        uses: actions/upload-artifact@v4
        with:
          name: Zoomify-apk
          path: |
            android/Zoomify.apk
            android/signing-report/

      - name: Upload rotation-test APKs (test only)
        uses: actions/upload-artifact@v4
        with:
          name: rotation-test-apks
          path: android/test-apks/
          retention-days: 2

  rotation-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 31, 33]   # Android 11, 12, 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rotation-test-apks
          path: test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Key-rotation test on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/scripts/rotation-test.sh
      - name: Upload rotation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-report-api${{ matrix.api-level }}
          path: rotation-report-api*.txt

  publish:
    needs: [build, rotation-test]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Zoomify-apk
          path: dist
      - name: Create the versioned release (never deletes existing releases)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          SHA=$(cut -d' ' -f1 dist/signing-report/Zoomify.apk.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump versionName/versionCode for a new release."
            exit 1
          fi
          cat > notes.md <<EOF
          ## Zoomify $VERSION: security update

          **Please install this version over your current Zoomify.** Your app stays installed and your photos are kept.

          ### Why this update matters
          The private key used to sign Zoomify 1.0 was accidentally made public. This release is signed with a **new private
          signing key** and includes an **Android key-rotation proof** (APK Signature Scheme v3):

          - Installing $VERSION over 1.0 works as a normal update.
          - Once $VERSION is installed, Android **rejects** any APK signed only with the old key, so a fake "update" can't
            replace your app.
          - Only download Zoomify from https://zoomify.houseli.site or this GitHub page.

          ### Verify your download
          - Signing certificate SHA-256: \`72:96:CD:BF:1D:D6:13:C7:53:17:E4:5A:28:8F:AB:9B:C0:43:D8:2D:E5:33:9D:44:FB:EC:70:BF:91:A7:CC:CF\`
          - \`Zoomify.apk\` SHA-256: \`$SHA\`

          ### New in $VERSION
          - 60 fps video where the phone guarantees it for the chosen resolution and mode
          - Telephoto lens support on phones that expose one to apps
          - RAW (16-bit DNG) search across all back cameras, with clear messages when a phone doesn't offer RAW

          ### Testing
          - Tested on a Samsung Galaxy A36 (real device): installed over 1.0 without uninstalling.
          - Installation and the key-rotation update were tested automatically on Android 11, 12 and 13 emulators,
            including rejection of an APK signed only with the old key. Emulators have no real camera, so camera features
            were not tested there. Other phones haven't been individually tested.

          Requires Android 11 or newer. Camera features depend on what each phone exposes to apps.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" dist/Zoomify.apk dist/signing-report/Zoomify.apk.sha256 \
            --title "Zoomify $VERSION (security update)" --notes-file notes.md --target "$GITHUB_SHA" --latest
          echo "Released $TAG"

      - name: Mark the old android-latest release as superseded (kept, with its download statistics)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --title "Zoomify 1.0 (superseded: install $TAG)" --notes "This is the old Zoomify 1.0 build, kept for history. **Please install [$TAG](https://github.com/$GH_REPO/releases/tag/$TAG) instead.** It's a security update that installs over 1.0 and keeps your photos."
          fi

      - name: Verify the published APK
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          curl -sSfL -o published.apk "https://github.com/${{ github.repository }}/releases/download/$TAG/Zoomify.apk"
          cmp published.apk dist/Zoomify.apk && echo "Published APK is byte-identical to the verified build"

  deploy-site:
    needs: [build, publish]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TAG: ${{ needs.publish.outputs.tag }}
      ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
      ADSENSE_ENABLE_ADS: ${{ vars.ADSENSE_ENABLE_ADS }}
      ADSENSE_SLOT_HOME: ${{ vars.ADSENSE_SLOT_HOME }}
      ADSENSE_SLOT_HELP: ${{ vars.ADSENSE_SLOT_HELP }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
    steps:
      - name: Cloudflare secrets missing
        if: env.HAS_CLOUDFLARE != 'true'
        run: |
          echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the website (see README)."
          exit 1
      - uses: actions/checkout@v4
      - name: Build the site
        run: |
          set -euo pipefail
          rm -rf site-dist && cp -r site site-dist
          sed -i "s/__RELEASE_TAG__/$TAG/g" site-dist/_redirects
          # AdSense: only with a real publisher ID from the ADSENSE_PUBLISHER_ID repository variable. Never invented.
          if [ -n "$ADSENSE_PUBLISHER_ID" ]; then
            [[ "$ADSENSE_PUBLISHER_ID" =~ ^pub-[0-9]{16}$ ]] || { echo "::error::ADSENSE_PUBLISHER_ID must look like pub-0000000000000000"; exit 1; }
            TAGLINE="<script async src=\"https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-$ADSENSE_PUBLISHER_ID\" crossorigin=\"anonymous\"></script>"
            for f in site-dist/*.html; do python3 - "$f" "$TAGLINE" <<'PY'
          import sys; p, tag = sys.argv[1], sys.argv[2]
          t = open(p, encoding="utf-8").read().replace("<!-- ADSENSE_HEAD -->", tag)
          open(p, "w", encoding="utf-8").write(t)
          PY
            done
            echo "google.com, $ADSENSE_PUBLISHER_ID, DIRECT, f08c47fec0942fa0" > site-dist/ads.txt
            # Ad units stay hidden unless ads are explicitly enabled (after AdSense approval).
            if [ "$ADSENSE_ENABLE_ADS" = "true" ]; then
              python3 - <<'PY'
          import os, re
          pub = os.environ["ADSENSE_PUBLISHER_ID"]
          slots = {"home-mid": os.environ.get("ADSENSE_SLOT_HOME", ""), "help-mid": os.environ.get("ADSENSE_SLOT_HELP", "")}
          for f in ("site-dist/index.html", "site-dist/help.html"):
              t = open(f, encoding="utf-8").read()
              for name, slot in slots.items():
                  if not re.fullmatch(r"[0-9]{6,12}", slot or ""): continue
                  unit = (f'<div class="ad-slot container" data-ad-slot="{name}" aria-label="Advertisement">'
                          f'<p style="font-size:11px;letter-spacing:.12em;color:#a09fa9;margin:0 0 6px">ADVERTISEMENT</p>'
                          f'<ins class="adsbygoogle" style="display:block" data-ad-client="ca-{pub}" data-ad-slot="{slot}" '
                          f'data-ad-format="auto" data-full-width-responsive="true"></ins>'
                          f'<script>(adsbygoogle=window.adsbygoogle||[]).push({{}});</script></div>')
                  t = re.sub(rf'<div class="ad-slot( container)?" data-ad-slot="{name}" hidden aria-label="Advertisement"></div>', unit, t)
              open(f, "w", encoding="utf-8").write(t)
          PY
            fi
          fi
          if [ -n "$CONTACT_EMAIL" ]; then
            sed -i "s|<!-- CONTACT_EMAIL -->|<p><b>Email:</b> <a href=\"mailto:$CONTACT_EMAIL\">$CONTACT_EMAIL</a></p>|" site-dist/contact.html
          fi
          grep -rL "__RELEASE_TAG__" site-dist/_redirects >/dev/null

      - name: Verify site checker
        run: |
          cat > check-site.sh <<'EOF'
          #!/usr/bin/env bash
          # Usage: check-site.sh BASE_URL   -- fails on any broken page, link or redirect.
          set -uo pipefail
          BASE=${1%/}; ok=1
          check() { code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$1"); echo "$code $1"; [ "$code" = "$2" ] || ok=0; }
          check / 200; check /help.html 200; check /privacy.html 200; check /contact.html 200
          check /robots.txt 200; check /sitemap.xml 200; check /this-page-does-not-exist 404
          loc=$(curl -sS -o /dev/null -w '%{redirect_url}' "$BASE/download"); echo "/download -> $loc"
          [ "$loc" = "https://github.com/Houssam-2021/Zoomify/releases/download/$TAG/Zoomify.apk" ] || ok=0
          code=$(curl -sS -L -o /tmp/site.apk -w '%{http_code}' "$BASE/download"); echo "download follows to $code, $(stat -c %s /tmp/site.apk) bytes"
          [ "$code" = "200" ] && [ "$(stat -c %s /tmp/site.apk)" -gt 1000000 ] || ok=0
          loc=$(curl -sS -o /dev/null -w '%{redirect_url}' "$BASE/release-notes"); echo "/release-notes -> $loc"
          [ "$loc" = "https://github.com/Houssam-2021/Zoomify/releases/tag/$TAG" ] || ok=0
          curl -sS "$BASE/" | grep -q 'href="/download"' || { echo "home page has no /download link"; ok=0; }
          curl -sS "$BASE/" | grep -q 'android-latest' && { echo "home page still links android-latest"; ok=0; }
          # Every internal link on every page must resolve.
          for page in / /help.html /privacy.html /contact.html; do
            for href in $(curl -sS "$BASE$page" | grep -oE 'href="/[^"#]*' | sed 's/href="//' | sort -u); do
              c=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$href"); [ "$c" = 200 ] || [ "$c" = 302 ] || [ "$c" = 301 ] || { echo "BROKEN $page -> $href ($c)"; ok=0; }
            done
          done
          # External links (GitHub, policies) must resolve too.
          for href in $(curl -sS "$BASE/" "$BASE/help.html" "$BASE/privacy.html" "$BASE/contact.html" | grep -oE 'href="https://[^"]+' | sed 's/href="//' | sort -u); do
            c=$(curl -sS -L -o /dev/null -w '%{http_code}' -A "Mozilla/5.0" "$href"); echo "$c $href"
            [[ "$c" =~ ^(200|403|429)$ ]] || { echo "BROKEN external $href ($c)"; ok=0; }
          done
          [ $ok = 1 ] && echo "SITE CHECK PASSED: $BASE" || { echo "SITE CHECK FAILED: $BASE"; exit 1; }
          EOF
          chmod +x check-site.sh

      - name: Create the Pages project (if needed) and deploy a preview
        id: preview
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages project create zoomify --production-branch=main 2>&1 | tail -3 || true
          npx --yes wrangler@4 pages deploy site-dist --project-name=zoomify --branch=preview --commit-dirty=true | tee preview.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' preview.log | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL"

      - name: Test the preview
        run: |
          sleep 20
          ./check-site.sh "${{ steps.preview.outputs.url }}"

      - name: Deploy to production (pages.dev) only after the preview passed
        id: prod
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy site-dist --project-name=zoomify --branch=main --commit-dirty=true | tee prod.log
          SUB=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/zoomify" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['subdomain'])")
          echo "url=https://$SUB" >> "$GITHUB_OUTPUT"
          echo "Production: https://$SUB"

      - name: Test production
        run: |
          sleep 20
          ./check-site.sh "${{ steps.prod.outputs.url }}"
          echo "### Website deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: ${{ steps.prod.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next: attach zoomify.houseli.site in Cloudflare Pages -> zoomify -> Custom domains (see README)." >> "$GITHUB_STEP_SUMMARY"
