name: Android APK

# Every push: build, sign (new key + v3 rotation proof), verify, audit, and test the key rotation on Android 11/12/13
# emulators. Nothing public changes.
# Publishing: Actions -> Android APK -> Run workflow, tick "publish". Only runs after every check above passes.
# The website is deployed separately by site.yml; its /download link always follows the latest verified release.

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/rotation-test.sh"
      - ".github/scripts/refresh-legacy-link.sh"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish: create the versioned GitHub release (and refresh the old android-latest link)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  NEW_CERT_SHA256: 7296cdbf1dd613c75317e45a288fab9bc043d82de5339d44fbec70bf91a7cccf
  LEGACY_CERT_SHA256: 1a9f720214ac233d6f5be7e1ae5994911fbdab50d52ae43659521c0dab8dc12c   # certificate only (public)
  LINEAGE_SHA256: f11b259a6569c3bc79ebe78d3ae96ccf8e46a6d33cad9485ac522a1b0e090235
  V11_SHA256: ebca94a408dad408bb4556f8ccf6addb83c7247e3a4ad685086798907194597a
  FIXTURE_RELEASE: PRIVATE test fixtures (draft, never publish)
  FIXTURES_SHA256: |
    e8474c624adb1d686363d1880077776affe91fe201bbd1b8016e1372aa5c3dda  test-apks/zoomify-1.0-legacy.apk
    eca12d2994f85fc1134be27d57a182eca873def7eb24b04e6966e2edd3a4ffff  test-apks/TEST-ONLY-legacy-attacker.apk

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
    env:
      HAS_SIGNING_KEY: ${{ secrets.ZOOMIFY_KEYSTORE_B64 != '' && secrets.ZOOMIFY_KEYSTORE_PASSWORD != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: meta
        run: |
          echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(grep -oP 'val zoomifyVersionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build unsigned release APK (and a test-only "future update" with versionCode + 1)
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/release-unsigned.apk"
          ./gradlew --no-daemon assembleRelease -PzoomifyTestVersionCode=$(( ${{ steps.meta.outputs.version_code }} + 1 ))
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/future-unsigned.apk"

      - name: Unit tests (60 fps decision, frame-rate meter, horizon lock maths)
        run: ./gradlew --no-daemon testReleaseUnitTest

      # Public releases are never signed with the compromised legacy key. Without the new key, stop here.
      - name: Require the new signing key
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::error::Add the ZOOMIFY_KEYSTORE_B64 and ZOOMIFY_KEYSTORE_PASSWORD repository secrets. Nothing was published."
          exit 1

      # Key rotation (APK Signature Scheme v3). The rotation proof ("lineage") was signed once by the old key when v1.1
      # was made; it is public data and is reused unchanged from v1.1 (android/signing/zoomify-v1.1.lineage), so the
      # compromised key is no longer needed (or present). In it the old key keeps "installed data" (1.0 installs can
      # update) but has no "rollback", so once a phone has 1.1 or newer, an APK signed only with the old key is rejected.
      - name: Sign with the new key and the v1.1 rotation proof
        env:
          ZOOMIFY_KEYSTORE_B64: ${{ secrets.ZOOMIFY_KEYSTORE_B64 }}
          ZOOMIFY_KEYSTORE_PASSWORD: ${{ secrets.ZOOMIFY_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "$LINEAGE_SHA256  signing/zoomify-v1.1.lineage" | sha256sum -c
          umask 077
          KEYDIR="$RUNNER_TEMP/keys"
          mkdir -p "$KEYDIR" test-apks
          echo "$ZOOMIFY_KEYSTORE_B64" | base64 -d > "$KEYDIR/new.p12"
          sign() {
            "$BT/zipalign" -p -f 4 "$1" "$KEYDIR/aligned.apk"
            "$BT/apksigner" sign --ks "$KEYDIR/new.p12" --ks-type PKCS12 --ks-pass env:ZOOMIFY_KEYSTORE_PASSWORD \
              --ks-key-alias zoomify --lineage signing/zoomify-v1.1.lineage --rotation-min-sdk-version 28 \
              --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
              --out "$2" "$KEYDIR/aligned.apk"
          }
          sign "$RUNNER_TEMP/release-unsigned.apk" Zoomify.apk
          # Test-only: proves a future version signed the same way updates in place. Never published.
          sign "$RUNNER_TEMP/future-unsigned.apk" test-apks/TEST-ONLY-future-update.apk
          rm -rf "$KEYDIR"
          cp Zoomify.apk test-apks/Zoomify.apk

      # Mandatory: any failure here stops the build, so nothing unverified can be published.
      - name: Verify signature, rotation proof and version
        run: |
          set -euo pipefail
          mkdir -p signing-report
          check_signing() {   # <apk> <report-prefix>
            "$BT/apksigner" verify -v --print-certs "$1" > "signing-report/$2-verify.txt"
            "$BT/apksigner" lineage --in "$1" --print-certs > "signing-report/$2-lineage.txt"
            cat "signing-report/$2-verify.txt" "signing-report/$2-lineage.txt"
            grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "signing-report/$2-verify.txt"
            grep -q "Number of signers: 1" "signing-report/$2-verify.txt"
            grep -q "certificate SHA-256 digest: $NEW_CERT_SHA256" "signing-report/$2-verify.txt" \
              || { echo "::error::$1 is not signed with the new release key"; exit 1; }
            # v3 only (minSdk 30 always verifies v3): no v1/v2 block, so the APK carries no signature by the compromised
            # key. (v1/v2 signatures would have to be made by the oldest key in the lineage.)
            grep -q "Verified using v1 scheme (JAR signing): false" "signing-report/$2-verify.txt"
            grep -q "Verified using v2 scheme (APK Signature Scheme v2): false" "signing-report/$2-verify.txt" \
              || { echo "::error::$1 has a v1/v2 signature"; exit 1; }
            # Lineage must be exactly: legacy (rollback revoked) -> new key.
            LINEAGE_TXT="signing-report/$2-lineage.txt" python3 - <<'PY'
          import os, re
          signers, current = {}, None
          for line in open(os.environ["LINEAGE_TXT"]):
              m = re.match(r"Signer #(\d+) in lineage certificate SHA-256 digest: ([0-9a-f]+)", line)
              if m:
                  current = int(m.group(1)); signers[current] = {"digest": m.group(2)}
                  continue
              m = re.match(r"Has (.+?) capability\s*: (\w+)", line)
              if m and current is not None:
                  signers[current][m.group(1)] = m.group(2)
          assert sorted(signers) == [1, 2], f"expected exactly 2 signers in lineage, got {sorted(signers)}"
          old, new = signers[1], signers[2]
          assert old["digest"] == os.environ["LEGACY_CERT_SHA256"], "lineage does not start at the legacy key"
          assert new["digest"] == os.environ["NEW_CERT_SHA256"], "lineage does not end at the new key"
          assert old["installed data"] == "true", "legacy key must keep installed-data (in-place updates)"
          assert old["rollback"] == "false", "legacy key must not have rollback"
          print("Lineage OK: legacy -> new, legacy rollback revoked:", signers)
          PY
          }
          check_signing Zoomify.apk release
          check_signing test-apks/TEST-ONLY-future-update.apk future
          "$BT/aapt2" dump badging test-apks/TEST-ONLY-future-update.apk > signing-report/future-badging.txt
          grep -q "versionCode='$(( ${{ steps.meta.outputs.version_code }} + 1 ))'" signing-report/future-badging.txt
          "$BT/aapt2" dump badging Zoomify.apk | tee signing-report/badging.txt
          grep -q "versionCode='${{ steps.meta.outputs.version_code }}'" signing-report/badging.txt
          grep -q "versionName='${{ steps.meta.outputs.version }}'" signing-report/badging.txt
          grep -q "debuggable" signing-report/badging.txt && { echo "::error::APK is debuggable"; exit 1; } || true
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml Zoomify.apk > signing-report/AndroidManifest.txt
          # Permission allow-list: no INTERNET (photos can't leave the phone) and no app-defined permissions
          # (they break key-rotation updates on Android 11/12).
          PERMS=$(grep -oP "^uses-permission: name='\K[^']+" signing-report/badging.txt | sort -u | tr '\n' ' ')
          echo "Permissions: $PERMS"
          [ "$PERMS" = "android.permission.CAMERA android.permission.RECORD_AUDIO android.permission.VIBRATE " ] \
            || { echo "::error::Unexpected permissions: $PERMS"; exit 1; }
          grep -q "E: permission " signing-report/AndroidManifest.txt && { echo "::error::APK defines a custom permission"; exit 1; } || true
          sha256sum Zoomify.apk | tee signing-report/Zoomify.apk.sha256

      - name: Upload signed APK and report
        uses: actions/upload-artifact@v4
        with:
          name: Zoomify-apk
          path: |
            android/Zoomify.apk
            android/signing-report/

      - name: Upload rotation-test APKs (test only)
        uses: actions/upload-artifact@v4
        with:
          name: rotation-test-apks   # new-key builds only; deleted again when the tests finish
          path: android/test-apks/
          retention-days: 1

  rotation-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # only to read the private (draft) fixture release; nothing is written
    env:
      CUR_VC: ${{ needs.build.outputs.version_code }}
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 31, 33]   # Android 11, 12, 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rotation-test-apks
          path: test-apks
      - name: Get the private fixtures and the published v1.1 (checksums pinned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "FUT_VC=$(( CUR_VC + 1 ))" >> "$GITHUB_ENV"
          REL=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[]|select(.draft and .name==\"$FIXTURE_RELEASE\")][0].id")
          [ -n "$REL" ] && [ "$REL" != null ] || { echo "::error::Private fixture draft not found"; exit 1; }
          for f in zoomify-1.0-legacy.apk TEST-ONLY-legacy-attacker.apk; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$REL/assets" --jq ".[]|select(.name==\"$f\")|.id")
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "test-apks/$f"
          done
          curl -sSfL -o test-apks/Zoomify-v1.1.apk https://github.com/Houssam-2021/Zoomify/releases/download/v1.1/Zoomify.apk
          printf '%s\n' "$FIXTURES_SHA256" "$V11_SHA256  test-apks/Zoomify-v1.1.apk" | sed '/^$/d' | sha256sum -c
          ls -l test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Emulators occasionally hang while booting on CI; each attempt is time-limited and retried once.
      - name: Key-rotation test on Android API ${{ matrix.api-level }}
        id: attempt1
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/scripts/rotation-test.sh
      - name: Retry key-rotation test on Android API ${{ matrix.api-level }}
        if: steps.attempt1.outcome != 'success'
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -no-snapshot-load
          script: bash .github/scripts/rotation-test.sh
      - name: Upload rotation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-report-api${{ matrix.api-level }}
          path: rotation-report-api*.txt

  # Test APKs are only needed by the emulator jobs; delete them so they don't linger as downloadable artifacts.
  delete-test-apks:
    needs: rotation-test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[]|select(.name=="rotation-test-apks")|.id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "deleted test artifact $id"
          done

  publish:
    needs: [build, rotation-test]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Zoomify-apk
          path: dist
      - name: Create the versioned release (never deletes existing releases)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          SHA=$(cut -d' ' -f1 dist/signing-report/Zoomify.apk.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump versionName/versionCode for a new release."
            exit 1
          fi
          cat > notes.md <<EOF
          ## Zoomify $VERSION: security update

          **Please install this version over your current Zoomify.** Your app stays installed and your photos are kept.

          ### Why this update matters
          The private key used to sign Zoomify 1.0 was accidentally made public. This release is signed with a **new private
          signing key** and includes an **Android key-rotation proof** (APK Signature Scheme v3):

          - Installing $VERSION over 1.0 works as a normal update.
          - Once $VERSION is installed, Android **rejects** any APK signed only with the old key, so a fake "update" can't
            replace your app.
          - Only download Zoomify from https://zoomify.houseli.site or this GitHub page.

          ### Verify your download
          - Signing certificate SHA-256: \`72:96:CD:BF:1D:D6:13:C7:53:17:E4:5A:28:8F:AB:9B:C0:43:D8:2D:E5:33:9D:44:FB:EC:70:BF:91:A7:CC:CF\`
          - \`Zoomify.apk\` SHA-256: \`$SHA\`

          ### New in $VERSION
          - 60 fps video where the phone guarantees it for the chosen resolution and mode
          - Telephoto lens support on phones that expose one to apps
          - RAW (16-bit DNG) search across all back cameras, with clear messages when a phone doesn't offer RAW

          ### Testing
          - Tested on a Samsung Galaxy A36 (real device): installed over 1.0 without uninstalling.
          - Installation and the key-rotation update were tested automatically on Android 11, 12 and 13 emulators,
            including rejection of an APK signed only with the old key. Emulators have no real camera, so camera features
            were not tested there. Other phones haven't been individually tested.

          Requires Android 11 or newer. Camera features depend on what each phone exposes to apps.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" dist/Zoomify.apk dist/signing-report/Zoomify.apk.sha256 \
            --title "Zoomify $VERSION (security update)" --notes-file notes.md --target "$GITHUB_SHA" --latest
          echo "Released $TAG"

      - uses: actions/checkout@v4
        with:
          path: repo
      # The widely shared old URL (releases/download/android-latest/Zoomify.apk) must serve the newest verified APK.
      - name: Point the old android-latest link at this release (history kept, nothing deleted)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1) bash repo/.github/scripts/refresh-legacy-link.sh dist/Zoomify.apk "$TAG"

      - name: Verify the published APK
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          curl -sSfL -o published.apk "https://github.com/${{ github.repository }}/releases/download/$TAG/Zoomify.apk"
          cmp published.apk dist/Zoomify.apk && echo "Published APK is byte-identical to the verified build"
