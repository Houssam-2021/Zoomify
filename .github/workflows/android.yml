name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "site/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish: replace the public android-latest release and deploy the Cloudflare site"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ZOOMIFY_KEYSTORE_B64 != '' && secrets.ZOOMIFY_KEYSTORE_PASSWORD != '' }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      # Pushes only make a signed test APK (an artifact). Publishing is a manual "Run workflow" with publish ticked.
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # Public releases are never signed with the leaked legacy key alone. Without the new key, stop here.
      - name: Require the new signing key
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::error::Add the ZOOMIFY_KEYSTORE_B64 and ZOOMIFY_KEYSTORE_PASSWORD repository secrets. Nothing was published."
          exit 1

      # Key rotation (APK Signature Scheme v3): the APK carries a proof, signed by the old (leaked) key, that the
      # new key replaces it. Existing installs accept it as a normal update. The old key loses "rollback", so once a
      # phone has this version, an APK signed only with the leaked key can no longer be installed over it.
      - name: Sign with the new key and rotation proof
        env:
          ZOOMIFY_KEYSTORE_B64: ${{ secrets.ZOOMIFY_KEYSTORE_B64 }}
          ZOOMIFY_KEYSTORE_PASSWORD: ${{ secrets.ZOOMIFY_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools $BT"
          umask 077
          KEYDIR="$RUNNER_TEMP/keys"
          mkdir -p "$KEYDIR"
          echo "$ZOOMIFY_KEYSTORE_B64" | base64 -d > "$KEYDIR/new.p12"
          LEGACY=app/zoomify-sideload.keystore

          "$BT/apksigner" rotate --out "$KEYDIR/lineage.bin" \
            --old-signer --ks "$LEGACY" --ks-pass pass:REDACTED --ks-key-alias zoomify --key-pass pass:REDACTED \
              --set-rollback false --set-permission false --set-shared-uid false --set-auth false \
            --new-signer --ks "$KEYDIR/new.p12" --ks-type PKCS12 --ks-pass env:ZOOMIFY_KEYSTORE_PASSWORD \
              --ks-key-alias zoomify

          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$KEYDIR/aligned.apk"

          "$BT/apksigner" sign \
            --ks "$LEGACY" --ks-pass pass:REDACTED --ks-key-alias zoomify --key-pass pass:REDACTED \
            --next-signer --ks "$KEYDIR/new.p12" --ks-type PKCS12 --ks-pass env:ZOOMIFY_KEYSTORE_PASSWORD \
              --ks-key-alias zoomify \
            --lineage "$KEYDIR/lineage.bin" --rotation-min-sdk-version 28 \
            --out Zoomify.apk "$KEYDIR/aligned.apk"

          echo "--- Signature check ---"
          "$BT/apksigner" verify -v --print-certs Zoomify.apk | tee "$RUNNER_TEMP/verify.txt"
          echo "--- Rotation lineage ---"
          "$BT/apksigner" lineage --in Zoomify.apk --print-certs | tee "$RUNNER_TEMP/lineage.txt"
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/verify.txt"
          grep -q "72:96:cd:bf:1d:d6:13:c7:53:17:e4:5a:28:8f:ab:9b:c0:43:d8:2d:e5:33:9d:44:fb:ec:70:bf:91:a7:cc:cf\|7296cdbf1dd613c75317e45a288fab9bc043d82de5339d44fbec70bf91a7cccf" \
            <(tr 'A-F' 'a-f' < "$RUNNER_TEMP/verify.txt") || { echo "::error::APK is not signed with the expected new key"; exit 1; }
          mkdir -p signing-report
          cp "$RUNNER_TEMP/verify.txt" "$RUNNER_TEMP/lineage.txt" signing-report/
          rm -rf "$KEYDIR"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoomify-apk-test
          path: |
            android/Zoomify.apk
            android/signing-report/

      - name: Publish as a GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Zoomify.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Zoomify for Android (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Signed with Zoomify's new release key (SHA-256 72:96:CD:BF:...:A7:CC:CF) and a key-rotation proof: install it over your current Zoomify to keep your settings and stay protected."

      # Cloudflare Pages (free plan: commercial use allowed, no usage-based billing). Skipped until you add the
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see README).
      # The APK itself stays on GitHub Releases (no Pages file-size limit); the site's /Zoomify.apk redirects there.
      - name: Prepare website
        if: env.PUBLISH == 'true' && env.HAS_CLOUDFLARE == 'true'
        run: |
          set -euo pipefail
          SIZE_BYTES=$(stat -c %s Zoomify.apk)
          rm -rf ../site-dist && cp -r ../site ../site-dist
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SIZE_MB=$(awk "BEGIN { printf \"%.1f\", $SIZE_BYTES / 1048576 }")
          sed -i "s/__VERSION__/$VERSION/; s/__BUILD__/${GITHUB_SHA::7}/; s/__SIZE__/$SIZE_MB/; s/__DATE__/$(date -u +%Y-%m-%d)/" ../site-dist/index.html

      - name: Deploy to Cloudflare Pages
        if: env.PUBLISH == 'true' && env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create zoomify --production-branch=main || true
          npx --yes wrangler@4 pages deploy ../site-dist --project-name=zoomify --branch=main --commit-dirty=true
