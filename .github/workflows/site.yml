name: Website (Cloudflare Pages)

# Website only: no Android build, no emulator tests, no releases.
# Run: Actions -> Website (Cloudflare Pages) -> Run workflow.
#   Every run deploys a preview and tests it (pages, links, downloads, HTTPS, phone + desktop layout).
#   "production" also deploys to production after the preview passes, then tests it.
#   "switch_domain" (needs production) moves zoomify.houseli.site from Vercel to Pages, verifies it,
#   and automatically restores the previous DNS record if the live checks fail.
on:
  workflow_dispatch:
    inputs:
      production:
        description: "Deploy to production after the preview passes"
        type: boolean
        default: false
      switch_domain:
        description: "Then point zoomify.houseli.site at Cloudflare Pages (DNS change)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

env:
  PROJECT: zoomify
  DOMAIN: zoomify.houseli.site
  ZONE: houseli.site
  CF_API: https://api.cloudflare.com/client/v4
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID (see README: Cloudflare Pages)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Use the existing Pages project (never creates one)
        id: project
        run: |
          set -euo pipefail
          resp=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('success') else 1)" \
            || { echo "::error::Pages project '$PROJECT' not found or token lacks 'Cloudflare Pages: Edit'. Not creating a new one."; echo "$resp" | head -c 600; exit 1; }
          SUB=$(echo "$resp" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['subdomain'])")
          echo "subdomain=$SUB" >> "$GITHUB_OUTPUT"
          echo "Project $PROJECT -> https://$SUB"

      - name: Build site
        env:
          ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
          ADSENSE_ENABLE_ADS: ${{ vars.ADSENSE_ENABLE_ADS }}
          ADSENSE_SLOT_HOME: ${{ vars.ADSENSE_SLOT_HOME }}
          ADSENSE_SLOT_HELP: ${{ vars.ADSENSE_SLOT_HELP }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          bash .github/scripts/build-site.sh
          echo "$GITHUB_SHA" > site-dist/version.txt

      - name: Install Chromium for the layout check
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm install --silent playwright@1.49.1 && npx playwright install --with-deps chromium >/dev/null
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Deploy preview
        id: preview
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy site-dist --project-name="$PROJECT" --branch=preview --commit-dirty=true | tee preview.log
          URL=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' preview.log | head -1)
          [ -n "$URL" ] || URL="https://preview.${{ steps.project.outputs.subdomain }}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Test preview
        run: |
          URL="${{ steps.preview.outputs.url }}"
          for i in $(seq 1 12); do [ "$(curl -sS "$URL/version.txt")" = "$GITHUB_SHA" ] && break; sleep 10; done
          bash .github/scripts/check-site.sh "$URL"
          mkdir -p layout && node .github/scripts/check-layout.cjs "$URL" layout
          echo "- Preview passed: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy production (only after the preview passed)
        if: inputs.production
        run: npx --yes wrangler@4 pages deploy site-dist --project-name="$PROJECT" --branch=main --commit-dirty=true

      - name: Test production
        if: inputs.production
        run: |
          URL="https://${{ steps.project.outputs.subdomain }}"
          for i in $(seq 1 12); do [ "$(curl -sS "$URL/version.txt")" = "$GITHUB_SHA" ] && break; sleep 10; done
          bash .github/scripts/check-site.sh "$URL"
          node .github/scripts/check-layout.cjs "$URL" layout
          echo "- Production passed: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Switch zoomify.houseli.site to Cloudflare Pages (auto-rollback on failure)
        if: inputs.production && inputs.switch_domain
        env:
          TARGET: ${{ steps.project.outputs.subdomain }}
        run: |
          set -uo pipefail
          H=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          api() { curl -sS "${H[@]}" "$@"; }
          ok() { python3 -c "import sys,json; sys.exit(0 if json.load(sys.stdin).get('success') else 1)"; }

          # 1. Attach the custom domain to the Pages project (idempotent).
          if ! api "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains/$DOMAIN" | ok; then
            api -X POST "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" -d "{\"name\":\"$DOMAIN\"}" | tee add.json | ok \
              || { echo "::error::Could not add $DOMAIN to the Pages project"; cat add.json; exit 1; }
          fi

          # 2. Point the DNS record at Pages, remembering the old value for rollback.
          ZONE_ID=$(api "$CF_API/zones?name=$ZONE" | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['id'] if r else '')")
          [ -n "$ZONE_ID" ] || { echo "::error::Token can't read zone $ZONE. Add 'Zone: DNS: Edit' and 'Zone: Zone: Read' for $ZONE to the token, or switch the record manually (README)."; exit 1; }
          api "$CF_API/zones/$ZONE_ID/dns_records?name=$DOMAIN" > old.json
          python3 - <<'PY' > old.env
          import json
          r = json.load(open("old.json"))["result"]
          if len(r) != 1: raise SystemExit(f"expected exactly one DNS record for the domain, found {len(r)}")
          r = r[0]
          print(f"REC_ID={r['id']}\nOLD_TYPE={r['type']}\nOLD_CONTENT={r['content']}\nOLD_PROXIED={str(r['proxied']).lower()}")
          PY
          [ -s old.env ] || { echo "::error::Unexpected DNS records for $DOMAIN; not changing anything."; cat old.json; exit 1; }
          source old.env
          echo "Current record (rollback target): $OLD_TYPE $DOMAIN -> $OLD_CONTENT (proxied=$OLD_PROXIED)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$OLD_CONTENT" != "$TARGET" ]; then
            api -X PATCH "$CF_API/zones/$ZONE_ID/dns_records/$REC_ID" -d "{\"type\":\"CNAME\",\"name\":\"$DOMAIN\",\"content\":\"$TARGET\",\"proxied\":true}" | tee patch.json | ok \
              || { echo "::error::DNS update refused (token needs 'Zone: DNS: Edit' for $ZONE). Nothing changed."; cat patch.json; exit 1; }
            echo "DNS: $DOMAIN -> $TARGET (proxied)"
          fi

          # 3. Wait for Pages to activate the domain, then verify the live site; roll back if it doesn't pass.
          rollback() {
            echo "::error::Live checks failed; restoring $DOMAIN -> $OLD_CONTENT"
            api -X PATCH "$CF_API/zones/$ZONE_ID/dns_records/$REC_ID" -d "{\"type\":\"$OLD_TYPE\",\"name\":\"$DOMAIN\",\"content\":\"$OLD_CONTENT\",\"proxied\":$OLD_PROXIED}" | ok \
              && echo "Rolled back DNS to $OLD_CONTENT" || echo "::error::ROLLBACK FAILED: set $DOMAIN back to $OLD_CONTENT in Cloudflare DNS manually."
            exit 1
          }
          for i in $(seq 1 40); do
            status=$(api "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains/$DOMAIN" | python3 -c "import sys,json; print(json.load(sys.stdin)['result'].get('status',''))")
            served=$(curl -sS "https://$DOMAIN/version.txt" 2>/dev/null || true)
            echo "domain status=$status, live version=${served:0:12}"
            [ "$status" = "active" ] && [ "$served" = "$GITHUB_SHA" ] && break
            sleep 15
          done
          [ "$served" = "$GITHUB_SHA" ] || rollback
          bash .github/scripts/check-site.sh "https://$DOMAIN" || rollback
          node .github/scripts/check-layout.cjs "https://$DOMAIN" layout || rollback
          echo "- $DOMAIN now served by Cloudflare Pages and verified. Remove it from the Vercel project when convenient." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-screenshots
          path: layout/
          if-no-files-found: ignore
